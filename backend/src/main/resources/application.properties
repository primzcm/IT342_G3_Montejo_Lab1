server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/collabmatch?sslmode=disable}
spring.datasource.username=${DATABASE_USERNAME:collabmatch}
spring.datasource.password=${DATABASE_PASSWORD:collabmatch}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DATABASE_POOL_IDLE_TIMEOUT_MS:10000}
spring.datasource.hikari.connection-timeout=${DATABASE_POOL_CONNECTION_TIMEOUT_MS:10000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:dev-jwt-secret-change-me}
app.jwt.access-token-ttl-seconds=900
app.jwt.refresh-token-ttl-seconds=2592000
